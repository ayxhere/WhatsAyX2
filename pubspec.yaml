name: whats_ayx
description: "WhatsAyX v2 — a clean WhatsApp tool app (Flutter + Node gateway). Separate app from AyXWhatsapp."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.4.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  socket_io_client: ^2.0.3
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.0
  sherpa_onnx: ^2.0.1
  audioplayers: ^6.4.0 # 6.5.0+ needs Dart ^3.6.0; workflow Flutter 3.24.5 ships Dart 3.5.4 (run #19 failed on 6.8.1). 6.4.0 has DeviceFileSource + play/stop used by voice_service.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/ayx-logo.png
